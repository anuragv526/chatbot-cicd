name: create-s3-bucket

# Trigger this by hand from the Actions tab — it won't run on push.
on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Bucket name (must be globally unique, lowercase, no spaces)"
        required: true
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"

permissions:
  id-token: write   # REQUIRED — without this, GitHub won't issue the OIDC token
  contents: read

jobs:
  create-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # PASTE YOUR ROLE ARN FROM STEP 22 HERE:
          role-to-assume: arn:aws:iam::483874865300:role/github-actions-oidc-role
          aws-region: ${{ inputs.aws_region }}

      - name: Confirm we're authenticated (sanity check)
        run: aws sts get-caller-identity

      - name: Create the bucket
        run: |
          if [ "${{ inputs.aws_region }}" = "us-east-1" ]; then
            aws s3api create-bucket \
              --bucket "${{ inputs.bucket_name }}" \
              --region "${{ inputs.aws_region }}"
          else
            aws s3api create-bucket \
              --bucket "${{ inputs.bucket_name }}" \
              --region "${{ inputs.aws_region }}" \
              --create-bucket-configuration LocationConstraint="${{ inputs.aws_region }}"
          fi

      - name: Block public access (safe default)
        run: |
          aws s3api put-public-access-block \
            --bucket "${{ inputs.bucket_name }}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Confirm it was created
        run: aws s3 ls | grep "${{ inputs.bucket_name }}"
